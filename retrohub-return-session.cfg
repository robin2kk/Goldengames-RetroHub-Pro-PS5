# RetroHub-launched RetroArch session only. Keep the main RetroArch config intact.
# 0 disables quitting RetroArch when Quick Menu > Close Content is selected.
quit_on_close_content = "0"

# If a core requests shutdown, keep RetroArch available for the next game.
load_dummy_on_core_shutdown = "true"

# Only sessions launched by the return-chord test frontend use this file.
network_cmd_enable = "true"
network_cmd_port = "55359"
network_cmd_bind_address = "127.0.0.1"
quit_press_twice = "false"
# Keep the main retroarch.cfg unchanged while testing this session.
config_save_on_exit = "false"
